[pytest]
testpaths = backend/common/tests backend/auth/tests backend/employees/tests backend/teams/tests backend/projects/tests backend/allocations/tests backend/reports/tests
addopts = --cov=backend/common --cov=backend/auth --cov=backend/employees --cov=backend/teams --cov=backend/projects --cov=backend/allocations --cov=backend/reports --cov-report=term-missing --cov-fail-under=80
markers =
    integration: needs a running PostgreSQL (docker start acme-postgres)
